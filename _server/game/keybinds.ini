; PSXRecomp input mapping for the LAN web build.
; Two independent keyboard players, used by the browser input bridge.
; PSX buttons are active when any listed source is pressed.

[controller]
enabled = true
device = 0
deadzone = 3277

[mapping]
up        = dpup
down      = dpdown
left      = dpleft
right     = dpright
triangle  = y
circle    = b
cross     = a
square    = x
l1        = leftshoulder
l2        = lefttrigger
r1        = rightshoulder
r2        = righttrigger
l3        = leftstick
r3        = rightstick
start     = start
select    = back
ls_up     = lefty-
ls_down   = lefty+
ls_left   = leftx-
ls_right  = leftx+
rs_up     = righty-
rs_down   = righty+
rs_left   = rightx-
rs_right  = rightx+

; Player 1 (left half of the split screen)
[player1]
up        = Up
down      = Down
left      = Left
right     = Right
triangle  = A
circle    = S
cross     = X
square    = Z
l1        = Q
l2        = E
r1        = W
r2        = R
l3        = T
r3        = Y
start     = Return
select    = Right Shift
ls_up     = Up
ls_down   = Down
ls_left   = Left
ls_right  = Right
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None

; Player 2 (right half of the split screen) - no overlap with P1
[player2]
up        = I
down      = K
left      = J
right     = L
triangle  = H
circle    = M
cross     = N
square    = Comma
l1        = U
l2        = P
r1        = O
r2        = Semicolon
l3        = None
r3        = None
start     = Backspace
select    = Tab
ls_up     = I
ls_down   = K
ls_left   = J
ls_right  = L
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None

